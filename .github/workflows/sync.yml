name: Sync upstream
on:
  schedule:
    - cron: '0 * * * *'  # 每小时检查一次
  workflow_dispatch:  # 允许手动触发
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync fork
        run: |
          git remote add upstream https://github.com/wzdnzd/aggregator.git
          git fetch upstream
          git checkout main
          git merge upstream/main
          git push origin main
